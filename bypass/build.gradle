plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bypass.growwkyc'
    compileSdk 34

    defaultConfig {
        applicationId "com.bypass.growwkyc"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

repositories {
    maven { url 'https://api.xposed.info/' }
    google()
    mavenCentral()
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
