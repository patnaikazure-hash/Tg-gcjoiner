name: Build Groww KYC Bypass APK

on:
  push:
    branches: [ groww-kyc-bypass ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build bypass APK
        run: ./gradlew :bypass:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrowwKycBypass
          path: bypass/build/outputs/apk/release/bypass-release-unsigned.apk
          retention-days: 7
