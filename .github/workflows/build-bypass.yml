name: Build Groww KYC Bypass APK

on:
  push:
    branches: [ groww-kyc-bypass ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fix gradlew JVM opts
        run: sed -i 's/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS=""/' gradlew

      - name: Build bypass APK
        env:
          JAVA_OPTS: "-Xmx2048m -Xms256m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"
        run: ./gradlew :bypass:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrowwKycBypass
          path: bypass/build/outputs/apk/release/bypass-release-unsigned.apk
          retention-days: 7
