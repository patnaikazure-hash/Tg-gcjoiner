name: Build Groww KYC Bypass APK

on:
  push:
    branches: [ groww-kyc-bypass ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare gradlew and wrapper jar
        run: |
          chmod +x gradlew
          # Fix broken quoted JVM opts that cause ClassNotFoundException
          sed -i "s/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS=''/" gradlew
          # Download the Gradle wrapper bootstrap jar from the official distribution
          mkdir -p gradle/wrapper
          curl -fL "https://services.gradle.org/distributions/gradle-8.6-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gdist
          # The wrapper jar lives at gradle-8.6/lib/gradle-wrapper-8.6.jar inside the zip
          find /tmp/gdist -name "gradle-wrapper*.jar" -not -name "*sources*" | head -1 \
            | xargs -I{} cp {} gradle/wrapper/gradle-wrapper.jar
          echo "Wrapper jar:"
          ls -lh gradle/wrapper/
          echo "Gradlew DEFAULT_JVM_OPTS line:"
          grep DEFAULT_JVM_OPTS gradlew

      - name: Build bypass APK
        env:
          JAVA_OPTS: "-Xmx2048m -Xms256m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :bypass:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrowwKycBypass
          path: bypass/build/outputs/apk/release/bypass-release-unsigned.apk
          retention-days: 7
