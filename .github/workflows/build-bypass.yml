name: Build Groww KYC Bypass APK

on:
  push:
    branches: [ groww-kyc-bypass ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.6
        run: |
          curl -fL "https://services.gradle.org/distributions/gradle-8.6-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Build bypass APK
        env:
          JAVA_OPTS: "-Xmx2048m -Xms256m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle :bypass:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrowwKycBypass
          path: bypass/build/outputs/apk/release/bypass-release-unsigned.apk
          retention-days: 7
